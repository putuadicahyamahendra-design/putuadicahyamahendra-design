name: generate animation

on:
  # dijalankan otomatis setiap 24 jam
  schedule:
    - cron: "0 */24 * * *" 
  
  # mengizinkan kamu menjalankan script ini secara manual
  workflow_dispatch:
  
  # dijalankan otomatis setiap kali kamu melakukan push ke branch main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # ini adalah bot yang membuat animasi ularnya
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # ini bot untuk menyimpan hasil animasi ke branch bernama "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
